name: Daily Network Status Report

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not post comment)'
        required: false
        default: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            python agent/daily_report.py --repo ${{ github.repository }} --dry-run
          else
            python agent/daily_report.py --repo ${{ github.repository }}
          fi
