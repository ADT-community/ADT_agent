name: Network status

on:
  schedule:
    - cron: "41 5 * * *"   # every day, 05:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the report without posting or writing status.json"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: adt-agent-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Post network status
        env:
          ADT_GITHUB_TOKEN: ${{ secrets.ADT_GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(status)
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m agent "${args[@]}"
